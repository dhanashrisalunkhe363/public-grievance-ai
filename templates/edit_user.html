
{% extends "base.html" %}

{% block content %}

<style>
    .edit-page {
        padding: 10px 0 60px;
    }

    /* Header */
    .edit-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        margin-bottom: 30px;
    }

    .edit-head small {
        color: #6366f1;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.5px;
    }

    .edit-head h1 {
        margin: 7px 0;
        color: #111827;
        font-size: 38px;
        line-height: 1.1;
    }

    .edit-head p {
        margin: 0;
        color: #64748b;
        font-size: 14px;
    }

    /* Button */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 11px 18px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        color: white !important;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: .2s ease;
        box-shadow: 0 7px 18px rgba(79,70,229,.18);
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(79,70,229,.25);
    }

    .btn.outline {
        background: white;
        color: #4f46e5 !important;
        border: 1px solid #c7d2fe;
        box-shadow: none;
    }

    /* Form Card */
    .formbox {
        position: relative;
        overflow: hidden;
        background: rgba(255,255,255,.97);
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 15px 40px rgba(15,23,42,.07);
    }

    .formbox.narrow {
        max-width: 650px;
        margin: 0 auto;
    }

    .formbox::before {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: #eef2ff;
        top: -90px;
        right: -60px;
    }

    .form-title {
        position: relative;
        margin-bottom: 25px;
    }

    .form-title small {
        color: #6366f1;
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 1.3px;
    }

    .form-title h2 {
        margin: 5px 0 0;
        color: #172033;
        font-size: 23px;
    }

    /* Form */
    form {
        position: relative;
    }

    label {
        display: block;
        margin: 17px 0 7px;
        color: #334155;
        font-size: 12px;
        font-weight: 800;
    }

    label:first-of-type {
        margin-top: 0;
    }

    label small {
        color: #94a3b8;
        font-size: 10px;
        font-weight: 500;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid #dbe3ef;
        border-radius: 10px;
        background: #f8fafc;
        color: #1e293b;
        font-family: inherit;
        font-size: 13px;
        outline: none;
        transition: .2s ease;
    }

    input:focus {
        background: white;
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99,102,241,.10);
    }

    input::placeholder {
        color: #a0aec0;
    }

    .password-note {
        margin-top: 8px;
        padding: 11px 13px;
        border-radius: 9px;
        background: #f5f3ff;
        border: 1px solid #ddd6fe;
        color: #6d28d9;
        font-size: 11px;
        line-height: 1.5;
    }

    .save-btn {
        width: 100%;
        margin-top: 25px;
        padding: 13px;
        font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 700px) {
        .edit-head {
            flex-direction: column;
            align-items: flex-start;
        }

        .edit-head h1 {
            font-size: 30px;
        }

        .formbox.narrow {
            padding: 25px 20px;
        }
    }

    @media (max-width: 480px) {
        .edit-head .btn {
            width: 100%;
        }
    }
</style>


<div class="edit-page">

    <!-- HEADER -->
    <div class="edit-head">

        <div>
            <small>USER MANAGEMENT</small>

            <h1>Edit User</h1>

            <p>
                Update citizen account details.
            </p>
        </div>

        <a class="btn outline" href="/admin">
            ← Back to Admin
        </a>

    </div>


    <!-- EDIT FORM -->
    <section class="formbox narrow">

        <div class="form-title">
            <small>ACCOUNT SETTINGS</small>
            <h2>Update Citizen Information</h2>
        </div>


        <form method="post">

            <!-- Name -->
            <label>Full Name</label>

            <input
                name="name"
                value="{{ user.name }}"
                required
            >


            <!-- Email -->
            <label>Email Address</label>

            <input
                type="email"
                name="email"
                value="{{ user.email }}"
                required
            >


            <!-- Password -->
            <label>
                New Password
                <small>(leave blank to keep current password)</small>
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter new password if required"
            >

            <div class="password-note">
                <strong>Password:</strong>
                Leave this field blank if you do not want to change the
                citizen's existing password.
            </div>


            <!-- Save -->
            <button class="btn save-btn" type="submit">
                Save Changes
            </button>

        </form>

    </section>

</div>

{% endblock %}
